[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
# Use --include=dev so build-time deps (tailwindcss, typescript, eslint-config-next)
# are installed even when Railway sets NODE_ENV=production.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npx tsx src/server/index.ts"
